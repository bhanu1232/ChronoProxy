name: Build & Push to Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:        # allow manual trigger from GitHub Actions tab

env:
  IMAGE_NAME: bhanuchowdam/chronoproxy

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Set up QEMU (for multi-arch builds) ─────────────────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # ── 3. Set up Docker Buildx ────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 4. Login to Docker Hub ─────────────────────────────────────────────
      #  Add secrets in GitHub → Settings → Secrets → Actions:
      #    DOCKERHUB_USERNAME  →  your Docker Hub username
      #    DOCKERHUB_TOKEN     →  Docker Hub access token (not password)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── 5. Extract metadata (tags & labels) ───────────────────────────────
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      # ── 6. Build & push ────────────────────────────────────────────────────
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers between builds — dramatically speeds up re-builds
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          # Build for amd64 (Render/Railway) and arm64 (Apple Silicon local)
          platforms: linux/amd64,linux/arm64
