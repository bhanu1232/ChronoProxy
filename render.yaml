# render.yaml — Render Infrastructure-as-Code
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy steps:
#   1. Push this file to GitHub (already done).
#   2. Go to https://dashboard.render.com → New → Blueprint.
#   3. Connect GitHub repo: bhanu1232/ChronoProxy
#   4. Render reads this file and creates the service automatically.
#   5. Add ENCRYPTION_KEY in the Environment tab before first request.

services:
  - type: web
    name: chronoproxy
    runtime: docker
    dockerfilePath: ./Dockerfile

    # free plan = 512MB RAM, spins down after 15 min idle.
    # Upgrade to "starter" ($7/mo) for always-on.
    plan: free

    # Health check path — Render polls this to confirm the app is ready.
    # The Playwright image is large (~1.5GB); give it 3 minutes to start.
    healthCheckPath: /v1/health

    envVars:
      # ── Server ──────────────────────────────────────────────────────────
      - key: PORT
        value: "10000"
      - key: HOST
        value: "0.0.0.0"
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: "--max-old-space-size=400"

      # ── Browser Pool ─────────────────────────────────────────────────────
      # Free plan: 512MB RAM. 2 browsers × 95MB = 190MB + 120MB Node = safe.
      - key: MAX_BROWSERS
        value: "2"
      - key: BROWSER_TIMEOUT_MS
        value: "30000"

      # ── Rate Limiting ─────────────────────────────────────────────────────
      - key: RATE_LIMIT_MAX
        value: "30"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"

      # ── Playwright ────────────────────────────────────────────────────────
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /ms-playwright

      # ── Secrets: add these manually in the Render dashboard ──────────────
      # ENCRYPTION_KEY  → 64-char hex string for AES-256-GCM vault
      # REDIS_HOST      → if you add a Redis service
      # REDIS_PORT
      # REDIS_PASSWORD
      # PG_HOST         → if you add a Postgres service
      # PG_PORT
      # PG_DATABASE
      # PG_USER
      # PG_PASSWORD
