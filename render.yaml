# ═══════════════════════════════════════════════════════════════════════════════
#  render.yaml — ChronoProxy Render Blueprint
#  Docs: https://render.com/docs/blueprint-spec
#
#  One-click deploy:
#    1. Push repo to GitHub (already done: bhanu1232/ChronoProxy)
#    2. Render Dashboard → New → Blueprint → connect repo
#    3. Set secret env vars in the Environment tab (see bottom of this file)
# ═══════════════════════════════════════════════════════════════════════════════

services:
  - type: web
    name: chronoproxy
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free                    # 512 MB RAM · 0.1 CPU · spins down after 15 min idle

    # Render polls this path to decide when the container is healthy.
    # The first deploy pulls Chromium (~300 MB) so allow generous startup time.
    healthCheckPath: /v1/health

    envVars:
      # Render injects $PORT automatically — the app reads it from process.env.PORT
      # DO NOT hardcode PORT here; let Render control it.

      - key: HOST
        value: "0.0.0.0"
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: "--max-old-space-size=350"

      # 2 browsers max on free tier (2 × 95 MB + 120 MB Node ≈ 310 MB)
      - key: MAX_BROWSERS
        value: "2"
      - key: BROWSER_TIMEOUT_MS
        value: "30000"

      - key: RATE_LIMIT_MAX
        value: "30"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"

      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /app/.playwright-browsers

      # ── Secrets: add these in the Render dashboard → Environment tab ─────────
      # ENCRYPTION_KEY   64-char hex string (AES-256-GCM vault key)
      # REDIS_HOST       Redis host (add a Render Redis service if needed)
      # REDIS_PORT       default 6379
      # REDIS_PASSWORD
      # PG_HOST          Postgres host (add a Render Postgres service if needed)
      # PG_PORT          default 5432
      # PG_DATABASE
      # PG_USER
      # PG_PASSWORD
