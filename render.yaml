# render.yaml — Render Infrastructure-as-Code
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy steps:
#   1. Push this file (and your code) to GitHub.
#   2. Go to https://dashboard.render.com → New → Blueprint.
#   3. Connect your GitHub repo (bhanu1232/ChronoProxy).
#   4. Render reads this file and sets up the service automatically.
#   5. Set the ENCRYPTION_KEY environment variable in the Render dashboard
#      (Environment tab of the service) before first deploy.

services:
  - type: web
    name: chronoproxy
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Render free tier: 512MB RAM — matches our pool ceiling perfectly.
    # Upgrade to "starter" ($7/mo) for always-on (no spin-down).
    plan: free

    # Health check — Render uses this to know when the container is ready.
    healthCheckPath: /v1/health

    envVars:
      # ── Server ──────────────────────────────────────────────────────────
      - key: PORT
        value: "8080"
      - key: HOST
        value: "0.0.0.0"
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: "--max-old-space-size=400"

      # ── Browser Pool ─────────────────────────────────────────────────────
      # Free tier has 512MB RAM. 2 browsers × ~95MB = 190MB + 120MB Node = 310MB safe.
      - key: MAX_BROWSERS
        value: "2"
      - key: BROWSER_TIMEOUT_MS
        value: "30000"

      # ── Rate Limiting ─────────────────────────────────────────────────────
      - key: RATE_LIMIT_MAX
        value: "30"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"

      # ── Playwright ────────────────────────────────────────────────────────
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /ms-playwright

      # ── Secrets: set these manually in the Render dashboard ──────────────
      # - key: ENCRYPTION_KEY     ← 64-char hex string for AES-256-GCM vault
      # - key: REDIS_HOST         ← If you add a Redis service
      # - key: REDIS_PORT
      # - key: REDIS_PASSWORD
      # - key: PG_HOST            ← If you add a Postgres service
      # - key: PG_PORT
      # - key: PG_DATABASE
      # - key: PG_USER
      # - key: PG_PASSWORD
